  </g>
  <g fill="none" stroke="#7fb6c4" stroke-width="2" stroke-linecap="round">
    <path d="m48 77 18 9m-1-8 21 11m0-4 21 11m-45-1 26 11m-46-4 21 9"/>
  </g>
  <g fill="none" stroke="#8aa8de" stroke-width="2" stroke-linecap="round">
    <path d="m176 107 22-9m-4 15 26-13m-8 17 21-10m-16-20 19-9"/>
  </g>
  <!-- Horizontal mist leaves gaps between the plateaus. -->
  <g fill="none" stroke="#9990b0" stroke-width="1.8" stroke-linecap="round">
    <path d="M117 64h29m9 0h9M103 75h18m6 0h20M79 119h21m-44 9h23m113-1h21"/>
  </g>
  <!-- The S bend widens towards the viewer. -->
  <path d="M145 103C130 109 112 110 117 117C122 124 172 122 174 134
    C176 145 139 148 125 157H95C106 144 157 141 157 134
    C157 129 112 128 108 119C104 110 131 108 145 103Z" fill="#7fb6c4"/>
