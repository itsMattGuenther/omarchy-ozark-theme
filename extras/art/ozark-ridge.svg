<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 256 160">
  <title>Ozark ridgeline — last light in the hollows</title>
  <desc>Three overlapping, eroded ridges below a setting sun, framed by cedars.
    Open hatching and a winding hollow replace solid bands of dots.</desc>
  <rect width="256" height="160" fill="white"/>
  <defs>
    <g id="cedar" fill="black">
      <path d="M0 0l-4 9h3l-7 8h5l-9 9h6l-9 10 12-3v8h5v-8l12 3
        -9-10h6l-9-9h5l-7-8h3Z"/>
    </g>
  </defs>
  <!-- The sun disappears behind the far plateau. -->
  <circle cx="177" cy="40" r="16" fill="none" stroke="black" stroke-width="2.2"/>
  <g fill="none" stroke="black" stroke-width="1.9" stroke-linecap="round">
    <path d="M119 28h20m66-8h13m-3 26h24M27 37h21m8 0h9"/>
  </g>
  <!-- White fills occlude the earlier contours; ridges never cross. -->
  <g fill="none" stroke="black" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
    <path fill="white" stroke="none" d="M6 71l17-8 14 1 15-8 15 2 17 8 19 1 21-10 14 2
      15-10 20-2 13 4 16-4 14 6 14-1 19 7V151H6Z"/>
    <path d="M6 71l17-8 14 1 15-8 15 2 17 8 19 1 21-10 14 2
      15-10 20-2 13 4 16-4 14 6 14-1 19 7"/>
    <path fill="white" stroke="none" d="M6 83l19-1 18-7 14 2 18-8 13 1 18 8 18 4 23 11
      20 3 18-4 19 3 16 6 17-1 11 3V151H6Z"/>
    <path d="M6 83l19-1 18-7 14 2 18-8 13 1 18 8 18 4 23 11
      20 3 18-4 19 3 16 6 17-1 11 3"/>
    <path fill="white" stroke="none" d="M6 123l24-6 19 3 16-5 22 2 20-7 18 1 23-9 17-1
      21-12 20-3 17-9 14 2 11-5V151H6Z"/>
    <path d="M6 123l24-6 19 3 16-5 22 2 20-7 18 1 23-9 17-1
      21-12 20-3 17-9 14 2 11-5"/>
  </g>
  <!-- Broken marks suggest wooded slopes without filling the valley. -->
  <g fill="none" stroke="black" stroke-width="1.9" stroke-linecap="round">
    <path d="M144 62l12-8m12 9 10-7m16 9 9-6m15 9 11-6"/>
    <path d="M39 90l15-8m10 11 14-11m9 17 10-11m10 17 8-8"/>
    <path d="M137 120l16-11m-2 17 18-14m1 8 19-17m3 9 17-16m4 9 17-14"/>
    <!-- A ribbon of water opens toward the viewer. -->
    <path d="M108 120q-28 5-10 11t-9 15m25-25q-20 5-2 10t-4 15"/>
    <path d="M53 136l14-4 12 1m57 7 14-4 17 1m-137 9h37m98 0h37"/>
  </g>
  <!-- Unequal clusters frame the view and leave the foreground open. -->
  <use href="#cedar" transform="translate(18 89) scale(1.15 1.35)"/>
  <use href="#cedar" transform="translate(41 110) scale(.8 .9)"/>
  <use href="#cedar" transform="translate(230 99) scale(1 1.18)"/>
  <use href="#cedar" transform="translate(210 122) scale(.65 .65)"/>
</svg>
