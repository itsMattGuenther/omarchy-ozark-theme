<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 256 160">
  <title>Blue hour — moonrise over the Ozark hollows</title>
  <desc>A harvest moon above receding blue ridges, cedar silhouettes and a
    luminous river. Sparse slope engraving and broken mist leave the valley open.</desc>
  <rect width="256" height="160" fill="#171525"/>
  <defs>
    <g id="cedar" fill="#9cbe80">
      <path d="M0 0-3 10-8 15-3 14-6 22-13 27-5 25-10 33-19 38-6 35
        -11 43-22 48-7 45-2 43-2 55H2V43L8 46 20 48 10 41 6 35
        17 38 10 31 5 25 12 27 6 19 3 14 7 15 3 9Z"/>
    </g>
  </defs>
  <circle cx="183" cy="29" r="21" fill="#dcb473"/>
  <g fill="none" stroke="#171525" stroke-width="2.2">
    <circle cx="174" cy="22" r="4"/><path d="M192 33a5 5 0 0 1-6 6"/>
  </g>
  <g fill="#dcb473">
    <path d="m116 9 1 4 4 1-4 1-1 4-1-4-4-1 4-1Z"/>
    <path d="m232 26 1 4 4 1-4 1-1 4-1-4-4-1 4-1Z"/>
    <circle cx="69" cy="18" r="1.2"/><circle cx="143" cy="28" r="1.3"/>
    <circle cx="216" cy="10" r="1.2"/><circle cx="92" cy="35" r="1.2"/>
  </g>
  <!-- Each nearer ridge occludes the one behind. -->
  <g fill="#171525" stroke-linejoin="round" stroke-linecap="round">
    <path d="M7 66 29 57 47 58 66 49 84 47 101 51 119 48 139 52 154 45
      173 46 188 53 207 50 223 54 248 46V157H7Z"/>
    <path d="M7 66 29 57 47 58 66 49 84 47 101 51 119 48 139 52 154 45
      173 46 188 53 207 50 223 54 248 46" fill="none" stroke="#9990b0" stroke-width="2.2"/>
    <path d="M8 79 29 71 47 72 64 62 85 63 109 72 126 80 145 78 163 71
      181 70 202 62 226 65 248 60V157H8Z"/>
    <path d="M8 79 29 71 47 72 64 62 85 63 109 72 126 80 145 78 163 71
      181 70 202 62 226 65 248 60" fill="none" stroke="#8aa8de" stroke-width="2.8"/>
    <path d="M7 64Q27 55 46 66L65 66 86 78Q100 87 119 90L143 103 124 116 7 136Z"/>
    <path d="M7 64Q27 55 46 66L65 66 86 78Q100 87 119 90L143 103"
      fill="none" stroke="#7fb6c4" stroke-width="3"/>
    <path d="m249 79-20 5-15-2-21 9-16 2-20 9-15 3-15 8 18 18 104 15Z"/>
    <path d="m249 79-20 5-15-2-21 9-16 2-20 9-15 3-15 8"
