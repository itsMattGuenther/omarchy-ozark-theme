<svg xmlns="http://www.w3.org/2000/svg" width="896" height="576" viewBox="0 0 224 144">
  <title>Hawksbill Crag — a cedar above the hollow</title>
  <desc>Terminal-scale linework: a wind-shaped cedar, the hooked sandstone ledge,
    a small walker, and distant wooded hills. Black marks become Braille dots.</desc>
  <rect width="224" height="144" fill="white"/>
  <!-- A small setting sun and quiet cloud strokes. -->
  <circle cx="179" cy="29" r="10" fill="none" stroke="black" stroke-width="2.3"/>
  <g fill="none" stroke="black" stroke-width="1.9" stroke-linecap="round">
    <path d="M140 20h12m44 21h15"/>
    <path d="M114 81l18-6 13 3 16-10 13 2 14-7 13 4 16-2"/>
    <path d="M108 99l20-6 14 2 19-9 14 2 19-7 23 3"/>
    <path d="M99 119l23-11 19 3 22-10 17 3 19-9 18 3"/>
    <path d="M124 128l22-7 17 1 23-10 14 2 17-5"/>
  </g>
  <!-- A hooked wedge with a substantial undercut. -->
  <path d="M5 76l18-7 24 1 19-7 23 2 19-5 22 3 14 5 18 3
    -9 8-23 10-20 6-13 13-11 19-3 12H5Z" fill="black"/>
  <!-- Open strata keep the rock readable at 112 by 72 dots. -->
  <g fill="none" stroke="white" stroke-width="2.4" stroke-linecap="round">
    <path d="M9 81l21-5 23 1 16-5 23 1 17-5 21 2 12 4"/>
    <path d="M7 90l21-4 16 1m8-1 24-5 20 1 16-5 14 1"/>
    <path d="M8 102l15-4 20 1 21-6 22-1 16-4"/>
    <path d="M7 117l17-6 19 1 15-5 21-3"/>
    <path d="M12 131l14-5 18 1 18-6m-36-35-4 10m30 11-5 12m30-39-4 9"/>
  </g>
  <!-- A cedar with a bent trunk and irregular, tiered boughs. -->
  <g fill="black">
    <path d="M31 72l5-18-3-17 4-19 3 18-1 17 1 17 9 4-15-2-10 3Z"/>
    <path d="M37 15l-5 9-10 4 10 1-8 6-12 4 18 1-9 5-14 4
      16 3 9-3-6 7-13 4 14 2 10-7 8 4 15-2-12-5-7-6 11 1 10-3
      -15-5-7-6 11 2 7-3-14-5-7-6Z"/>
    <path d="M67 67l2-19 2 19Zm2-25-6 11h5l-10 9 11-2 9 2-7-9h5Z"/>
    <circle cx="125" cy="44" r="2.7"/>
    <path d="M122 49h5l2 9 4 5-3 1-5-6-3 5h-3l3-8Z"/>
  </g>
</svg>
